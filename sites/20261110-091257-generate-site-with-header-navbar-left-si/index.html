<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market – Fruit &amp; Vegetables</title>
<meta name="description" content="A small guide to fruit and vegetables with characteristics for each item.">
<style>
:root{--bg:#f6f8f4;--panel:#fff;--ink:#1f2a1c;--muted:#5d6b58;--brand:#2e7d32;--brand-2:#66bb6a;--line:#e1e7dc;--hover:#eef5ea;--nav-w:260px;--radius:14px;--shadow:0 4px 18px rgba(30,60,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:var(--nav-w) 1fr;grid-template-areas:"header header" "nav main" "footer footer";min-height:100vh}
a{color:var(--brand)}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px}
header{grid-area:header;background:linear-gradient(120deg,#1b5e20,#43a047);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 24px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
header .logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:1.3rem;letter-spacing:.3px}
header .logo svg{width:34px;height:34px}
header p{margin:0 0 0 auto;opacity:.9;font-size:.95rem}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}
.menu-btn svg{width:22px;height:22px;display:block}
nav{grid-area:nav;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto}
nav .home-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:10px}
nav .home-link:hover,nav .home-link[aria-current=page]{background:var(--hover);color:var(--brand)}
.group{margin-bottom:8px}
.group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:10px 12px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted);cursor:pointer;border-radius:10px}
.group-toggle:hover{background:var(--hover);color:var(--ink)}
.group-toggle .chev{width:16px;height:16px;transition:transform .25s}
.group-toggle[aria-expanded=false] .chev{transform:rotate(-90deg)}
.group-items{list-style:none;margin:0;padding:0 0 0 4px;overflow:hidden;transition:max-height .3s ease}
.group-items[hidden]{display:none}
.group-items a{display:flex;align-items:center;gap:10px;padding:7px 12px;margin:2px 0;border-radius:10px;text-decoration:none;color:var(--ink)}
.group-items a svg{width:26px;height:26px;flex:none}
.group-items a:hover{background:var(--hover)}
.group-items a[aria-current=page]{background:#dcedc8;color:#1b5e20;font-weight:600}
.nav-actions{display:flex;gap:6px;padding:4px 12px 12px}
.nav-actions button{flex:1;font:inherit;font-size:.78rem;padding:6px;border:1px solid var(--line);background:#fafcf8;border-radius:8px;cursor:pointer;color:var(--muted)}
.nav-actions button:hover{background:var(--hover);color:var(--ink)}
main{grid-area:main;padding:32px clamp(16px,4vw,48px);max-width:1000px;width:100%}
main:focus{outline:none}
h1{margin:0 0 6px;font-size:clamp(1.6rem,3vw,2.3rem)}
.lead{color:var(--muted);margin:0 0 26px;font-size:1.05rem}
.section-title{font-size:1.1rem;margin:28px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,60,20,.14)}
.card svg{width:64px;height:64px;display:block;margin:0 auto 8px}
.card span{font-weight:600}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.detail-head{display:flex;gap:24px;align-items:center;padding:28px;background:linear-gradient(135deg,#f1f8e9,#fff);border-bottom:1px solid var(--line);flex-wrap:wrap}
.detail-head .big{width:130px;height:130px;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);flex:none}
.detail-head .big svg{width:90px;height:90px}
.badge{display:inline-block;background:#dcedc8;color:#1b5e20;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.detail-body{padding:28px}
table{width:100%;border-collapse:collapse;margin:8px 0 20px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{width:38%;color:var(--muted);font-weight:600}
tr:last-child th,tr:last-child td{border-bottom:0}
.fact{background:#fffde7;border-left:4px solid #fbc02d;padding:12px 16px;border-radius:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pager a:hover{background:var(--hover)}
.pager svg{width:22px;height:22px}
footer{grid-area:footer;background:#1f2a1c;color:#cfd8c9;padding:18px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.9rem}
footer a{color:#a5d6a7}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.backdrop{display:none}
@media (max-width:800px){
 body{grid-template-columns:1fr;grid-template-areas:"header" "main" "footer"}
 .menu-btn{display:block}
 header p{display:none}
 nav{position:fixed;top:0;left:0;bottom:0;width:min(80vw,var(--nav-w));z-index:40;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow)}
 body.nav-open nav{transform:none}
 body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
 .detail-head{padding:20px}.detail-body{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
 <button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="sidenav" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
 <a class="logo" href="#home"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="36" r="22" fill="#fff" opacity=".2"/><path d="M32 18c-6-5-18-4-20 8-2 12 6 28 14 28 3 0 4-2 6-2s3 2 6 2c8 0 16-16 14-28-2-12-14-13-20-8z" fill="#fff"/><path d="M34 14c4-6 12-6 14-4-3 5-9 6-14 4z" fill="#c5e1a5"/></svg>Fresh Market</a>
 <p>Your friendly guide to fruit &amp; vegetables</p>
</header>
<div class="backdrop" id="backdrop"></div>
<nav id="sidenav" aria-label="Produce navigation"></nav>
<main id="main" tabindex="-1"></main>
<footer>
 <span>&copy; <span id="year"></span> Fresh Market. All rights reserved.</span>
 <span>Nutrition values are approximate, per 100 g raw. <a href="#home">Back to home</a></span>
</footer>
<script>
(function(){
var ICONS={
apple:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 20c-6-5-18-4-20 8-2 12 6 28 14 28 3 0 4-2 6-2s3 2 6 2c8 0 16-16 14-28-2-12-14-13-20-8z" fill="#e53935"/><path d="M20 28c1-4 4-6 7-6" stroke="#ff8a80" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M32 20c0-5 1-9 4-12" stroke="#6d4c41" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M35 14c4-6 12-6 14-4-3 5-9 6-14 4z" fill="#43a047"/></svg>',
pear:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 16c-5 0-7 5-7 10 0 6-11 10-11 19 0 8 8 13 18 13s18-5 18-13c0-9-11-13-11-19 0-5-2-10-7-10z" fill="#c0ca33"/><path d="M22 42c0-4 2-7 5-9" stroke="#e6ee9c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M32 16c0-4 1-7 3-10" stroke="#6d4c41" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 11c4-5 11-5 13-3-3 4-8 5-13 3z" fill="#558b2f"/></svg>',
banana:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 18c2 24 22 38 44 30 3-1 3-5 0-5-18 3-32-8-36-26-1-3-8-3-8 1z" fill="#fdd835" stroke="#f9a825" stroke-width="2" stroke-linejoin="round"/><path d="M18 24c4 12 14 20 28 22" stroke="#f9a825" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 18l-1-6 6 1z" fill="#6d4c41"/><circle cx="57" cy="45.5" r="2" fill="#5d4037"/></svg>',
carrots:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M40 18c5-2 9 3 6 7L17 56c-2 2-6-1-4-4z" fill="#fb8c00"/><path d="M30 30l4 3M25 38l4 3M20 46l3 2" stroke="#e65100" stroke-width="2" stroke-linecap="round"/><path d="M43 20c0-8 2-12 6-14M45 22c5-5 9-6 13-5M44 21c6-1 10 1 12 4" stroke="#43a047" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
onions:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12c2 8 18 14 18 29 0 10-8 15-18 15s-18-5-18-15c0-15 16-21 18-29z" fill="#c77d3a"/><path d="M32 16c-4 10-10 16-10 26M32 16c4 10 10 16 10 26M32 16v38" stroke="#8d4f1c" stroke-width="1.6" fill="none"/><path d="M32 12c0-4 1-6 3-8" stroke="#8bc34a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 56l-2 5M32 56v5M36 56l2 5" stroke="#bcaaa4" stroke-width="1.6" stroke-linecap="round"/></svg>',
garlic:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10c1 10 20 14 20 30 0 10-9 16-20 16s-20-6-20-16c0-16 19-20 20-30z" fill="#f5f5f0" stroke="#bdbdb0" stroke-width="2"/><path d="M32 18c-6 8-8 18-6 38M32 18c6 8 8 18 6 38M24 26c-6 6-8 14-6 26M40 26c6 6 8 14 6 26" stroke="#c9c9bb" stroke-width="1.6" fill="none"/><path d="M30 10l2-6 2 6" fill="#d7ccc8" stroke="#a1887f" stroke-width="1.4"/></svg>',
cabbage:'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="22" fill="#7cb342"/><path d="M14 30c4-10 14-14 18-14s14 4 18 14" fill="#9ccc65"/><circle cx="32" cy="36" r="13" fill="#c5e1a5"/><path d="M32 23v26M24 30c4 3 6 8 8 19M40 30c-4 3-6 8-8 19" stroke="#7cb342" stroke-width="1.6" fill="none"/><path d="M12 36c3 10 10 16 20 18M52 36c-3 10-10 16-20 18" stroke="#558b2f" stroke-width="2" fill="none"/></svg>',
potatoes:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 36c-2-12 8-20 22-22 13-2 22 6 20 18-2 13-12 20-24 20-10 0-17-6-18-16z" fill="#c8a165"/><path d="M18 30c2-6 8-10 14-10" stroke="#e0c48f" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="24" cy="40" r="1.8" fill="#7b5a2e"/><circle cx="38" cy="28" r="1.8" fill="#7b5a2e"/><circle cx="42" cy="42" r="1.8" fill="#7b5a2e"/><circle cx="32" cy="46" r="1.5" fill="#7b5a2e"/><circle cx="20" cy="32" r="1.4" fill="#7b5a2e"/></svg>'
};
var CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var GROUPS=[
{id:'fruit',name:'Fruit',items:[
{id:'apple',name:'Apple',latin:'Malus domestica',desc:'Crisp, juicy and endlessly versatile, the apple is one of the most widely cultivated tree fruits in the world.',c:{'Calories':'52 kcal','Carbohydrates':'14 g','Fiber':'2.4 g','Vitamin C':'4.6 mg (5% DV)','Colors':'Red, green, yellow','Season':'Late summer to autumn','Origin':'Central Asia (Kazakhstan)','Storage':'Refrigerate up to 6 weeks'},fact:'There are more than 7,500 known apple cultivars worldwide.'},
{id:'pear',name:'Pear',latin:'Pyrus communis',desc:'Sweet and buttery when ripe, pears ripen best off the tree and have a distinctive grainy texture.',c:{'Calories':'57 kcal','Carbohydrates':'15 g','Fiber':'3.1 g','Vitamin C':'4.3 mg (5% DV)','Colors':'Green, yellow, red, brown','Season':'August to February','Origin':'Europe & Western Asia','Storage':'Ripen at room temp, then refrigerate'},fact:'Pears ripen from the inside out — check the neck near the stem for softness.'},
{id:'banana',name:'Banana',latin:'Musa acuminata',desc:'A naturally packaged energy snack, rich in potassium and loved by athletes everywhere.',c:{'Calories':'89 kcal','Carbohydrates':'23 g','Fiber':'2.6 g','Potassium':'358 mg (8% DV)','Colors':'Yellow (green when unripe)','Season':'Year-round','Origin':'Southeast Asia','Storage':'Room temperature, away from other fruit'},fact:'Botanically, a banana is a berry — and the banana plant is a giant herb.'}]},
{id:'vegetables',name:'Vegetables',items:[
{id:'carrots',name:'Carrots',latin:'Daucus carota subsp. sativus',desc:'Sweet, crunchy root vegetables packed with beta-carotene, great raw or cooked.',c:{'Calories':'41 kcal','Carbohydrates':'10 g','Fiber':'2.8 g','Vitamin A':'835 µg (93% DV)','Colors':'Orange, purple, yellow, white','Season':'Summer to winter','Origin':'Persia (Iran/Afghanistan)','Storage':'Refrigerate, greens removed, 3–4 weeks'},fact:'The first cultivated carrots were purple and yellow; orange ones became popular in the 17th century.'},
{id:'onions',name:'Onions',latin:'Allium cepa',desc:'A kitchen staple forming the flavour base of countless dishes around the world.',c:{'Calories':'40 kcal','Carbohydrates':'9.3 g','Fiber':'1.7 g','Vitamin C':'7.4 mg (8% DV)','Colors':'Yellow, red, white','Season':'Year-round (harvest late summer)','Origin':'Central Asia','Storage':'Cool, dry, dark and ventilated'},fact:'Chilling an onion before cutting reduces the tear-inducing gas it releases.'},
{id:'garlic',name:'Garlic',latin:'Allium sativum',desc:'Pungent and aromatic, garlic bulbs are made of cloves that mellow and sweeten when roasted.',c:{'Calories':'149 kcal','Carbohydrates':'33 g','Fiber':'2.1 g','Vitamin B6':'1.2 mg (71% DV)','Colors':'White, purple-streaked','Season':'Harvest early to mid summer','Origin':'Central & South Asia','Storage':'Cool, dry place for several months'},fact:'Allicin, garlic\u2019s key compound, forms only after a clove is crushed or chopped.'},
{id:'cabbage',name:'Cabbage',latin:'Brassica oleracea var. capitata',desc:'Dense, leafy heads that are hardy, affordable and the star of slaws, soups and sauerkraut.',c:{'Calories':'25 kcal','Carbohydrates':'5.8 g','Fiber':'2.5 g','Vitamin K':'76 µg (63% DV)','Colors':'Green, red/purple, white','Season':'Autumn to spring','Origin':'Europe (Mediterranean)','Storage':'Refrigerate whole, up to 2 months'},fact:'Red cabbage changes colour with acidity — it can be used as a natural pH indicator.'},
{id:'potatoes',name:'Potatoes',latin:'Solanum tuberosum',desc:'Starchy tubers that are among the world\u2019s most important food crops, endlessly adaptable in the kitchen.',c:{'Calories':'77 kcal','Carbohydrates':'17 g','Fiber':'2.2 g','Vitamin C':'19.7 mg (22% DV)','Colors':'Brown, yellow, red, purple','Season':'Summer to autumn','Origin':'Andes (Peru/Bolivia)','Storage':'Cool, dark place — not the fridge'},fact:'In 1995 the potato became the first vegetable grown in space.'}]}
];
var ALL=[];GROUPS.forEach(function(g){g.items.forEach(function(i){i.group=g;ALL.push(i);});});
var STATE_KEY='fm-nav-state';
var state={};try{state=JSON.parse(localStorage.getItem(STATE_KEY))||{};}catch(e){}
function save(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state));}catch(e){}}
var nav=document.getElementById('sidenav');
var html='<a class="home-link" href="#home" data-id="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</a>';
html+='<div class="nav-actions"><button type="button" id="expandAll">Expand all</button><button type="button" id="collapseAll">Collapse all</button></div>';
GROUPS.forEach(function(g){
 var open=state[g.id]!==false;
 html+='<div class="group"><button type="button" class="group-toggle" aria-expanded="'+open+'" aria-controls="grp-'+g.id+'" data-group="'+g.id+'"><span>'+g.name+'</span>'+CHEV+'</button><ul class="group-items" id="grp-'+g.id+'"'+(open?'':' hidden')+'>';
 g.items.forEach(function(i){html+='<li><a href="#'+i.id+'" data-id="'+i.id+'">'+ICONS[i.id]+'<span>'+i.name+'</span></a></li>';});
 html+='</ul></div>';
});
nav.innerHTML=html;
function setGroup(btn,open){
 btn.setAttribute('aria-expanded',open);
 document.getElementById(btn.getAttribute('aria-controls')).hidden=!open;
 state[btn.dataset.group]=open;
}
nav.addEventListener('click',function(e){
 var t=e.target.closest('.group-toggle');
 if(t){setGroup(t,t.getAttribute('aria-expanded')!=='true');save();return;}
 if(e.target.closest('a'))closeNav();
});
document.getElementById('expandAll').onclick=function(){nav.querySelectorAll('.group-toggle').forEach(function(b){setGroup(b,true);});save();};
document.getElementById('collapseAll').onclick=function(){nav.querySelectorAll('.group-toggle').forEach(function(b){setGroup(b,false);});save();};
var menuBtn=document.getElementById('menuBtn');
function closeNav(){document.body.classList.remove('nav-open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.onclick=function(){var o=document.body.classList.toggle('nav-open');menuBtn.setAttribute('aria-expanded',o);if(o){var f=nav.querySelector('a,button');f&&f.focus();}};
document.getElementById('backdrop').onclick=closeNav;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('nav-open')){closeNav();menuBtn.focus();}});
var main=document.getElementById('main');
function cards(items){return '<div class="cards">'+items.map(function(i){return '<a class="card" href="#'+i.id+'">'+ICONS[i.id]+'<span>'+i.name+'</span></a>';}).join('')+'</div>';}
function renderHome(){
 document.title='Fresh Market – Fruit & Vegetables';
 var h='<h1>Welcome to Fresh Market</h1><p class="lead">Browse our produce guide. Pick an item from the sidebar or a card below to see its characteristics.</p>';
 GROUPS.forEach(function(g){h+='<h2 class="section-title">'+g.name+'</h2>'+cards(g.items);});
 main.innerHTML=h;
}
function renderItem(i){
 document.title=i.name+' – Fresh Market';
 var idx=ALL.indexOf(i),prev=ALL[(idx-1+ALL.length)%ALL.length],next=ALL[(idx+1)%ALL.length];
 var rows=Object.keys(i.c).map(function(k){return '<tr><th scope="row">'+k+'</th><td>'+i.c[k]+'</td></tr>';}).join('');
 main.innerHTML='<article class="detail"><div class="detail-head"><div class="big">'+ICONS[i.id]+'</div><div><span class="badge">'+i.group.name+'</span><h1>'+i.name+'</h1><p class="lead" style="margin:0"><em>'+i.latin+'</em></p></div></div><div class="detail-body"><p>'+i.desc+'</p><h2 class="section-title">Characteristics</h2><table><caption class="skip">'+i.name+' characteristics</caption><tbody>'+rows+'</tbody></table><p class="fact"><strong>Did you know?</strong> '+i.fact+'</p></div></article><div class="pager"><a href="#'+prev.id+'">&larr; '+ICONS[prev.id]+prev.name+'</a><a href="#'+next.id+'">'+next.name+ICONS[next.id]+' &rarr;</a></div>';
}
function route(){
 var id=(location.hash||'#home').slice(1).toLowerCase();
 var item=ALL.filter(function(i){return i.id===id;})[0];
 if(item){
  renderItem(item);
  var btn=nav.querySelector('[data-group="'+item.group.id+'"]');
  if(btn.getAttribute('aria-expanded')!=='true'){setGroup(btn,true);save();}
 }else{renderHome();id='home';}
 nav.querySelectorAll('a[data-id]').forEach(function(a){if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(route.ran){main.focus({preventScroll:true});window.scrollTo(0,0);}route.ran=true;
}
window.addEventListener('hashchange',route);
document.getElementById('year').textContent=new Date().getFullYear();
route();
})();
</script>
</body>
</html>
