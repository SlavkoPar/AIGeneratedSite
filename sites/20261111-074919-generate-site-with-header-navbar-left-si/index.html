<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market – Fruit & Vegetables</title>

<style>
:root{
  --bg:#f6f8f3;--surface:#fff;--text:#1f2a1f;--muted:#5c6b5c;--brand:#2f7d32;--brand-dark:#1f5c22;
  --border:#dfe6da;--accent:#f4a52b;--nav-w:260px;--radius:12px;--shadow:0 2px 10px rgba(30,60,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:var(--nav-w) 1fr;grid-template-areas:"header header" "nav main" "footer footer";min-height:100vh}
a{color:var(--brand)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:100}
.skip:focus{left:1rem;top:1rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Header */
header.site-header{grid-area:header;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;gap:1rem;padding:.9rem 1.5rem;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none;font-weight:700;font-size:1.3rem}
.logo svg{width:36px;height:36px}
.tagline{margin-left:auto;opacity:.85;font-size:.95rem}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:.45rem .6rem;cursor:pointer}
.menu-btn svg{width:24px;height:24px;display:block}

/* Nav */
nav.sidebar{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;overflow-y:auto;position:sticky;top:64px;height:calc(100vh - 64px)}
.nav-home{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:8px;text-decoration:none;color:var(--text);font-weight:600;margin-bottom:.5rem}
.nav-home:hover{background:var(--bg)}
.nav-home[aria-current=page]{background:#e5f2e3;color:var(--brand-dark)}
.nav-tools{display:flex;gap:.4rem;margin:0 .25rem .75rem}
.nav-tools button{flex:1;font:inherit;font-size:.78rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.3rem;cursor:pointer;color:var(--muted)}
.nav-tools button:hover{color:var(--text);border-color:var(--brand)}
.group{margin-bottom:.5rem}
.group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted);padding:.6rem .75rem;border-radius:8px;cursor:pointer}
.group-toggle:hover{background:var(--bg);color:var(--text)}
.group-toggle .count{font-weight:500;background:var(--bg);border-radius:999px;padding:0 .5rem;margin-left:.4rem;font-size:.72rem}
.chev{width:16px;height:16px;transition:transform .25s}
.group-toggle[aria-expanded=false] .chev{transform:rotate(-90deg)}
.group-items{list-style:none;margin:0;padding:0 0 0 .25rem;overflow:hidden;transition:max-height .3s ease}
.group-items[hidden]{display:none}
.group-items a{display:flex;align-items:center;gap:.65rem;padding:.45rem .75rem;border-radius:8px;text-decoration:none;color:var(--text)}
.group-items a:hover{background:var(--bg)}
.group-items a[aria-current=page]{background:#e5f2e3;color:var(--brand-dark);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.icon-sm{width:26px;height:26px;flex:none}

/* Main */
main{grid-area:main;padding:2rem clamp(1rem,3vw,3rem);max-width:1100px;width:100%}
h1{margin:.2rem 0 .5rem;font-size:clamp(1.7rem,3vw,2.4rem)}
.lead{color:var(--muted);font-size:1.08rem;max-width:65ch}
.section-title{margin:2rem 0 1rem;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1rem;text-align:center;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(30,60,30,.14)}
.card svg{width:64px;height:64px}
.card strong{display:block;margin-top:.5rem}
.card span{font-size:.85rem;color:var(--muted)}
.breadcrumb{font-size:.9rem;color:var(--muted)}
.breadcrumb a{text-decoration:none}
.hero{display:flex;gap:2rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);margin-top:1rem}
.hero-icon{width:150px;height:150px;flex:none;background:var(--bg);border-radius:50%;display:grid;place-items:center}
.hero-icon svg{width:110px;height:110px}
.hero-text{flex:1;min-width:240px}
.badge{display:inline-block;background:#e5f2e3;color:var(--brand-dark);border-radius:999px;padding:.15rem .7rem;font-size:.8rem;font-weight:600}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;margin:1.5rem 0}
.spec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.spec dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.spec dd{margin:.25rem 0 0;font-weight:600}
.nutri{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem}
.bar{margin:.6rem 0}
.bar-label{display:flex;justify-content:space-between;font-size:.9rem}
.bar-track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:.25rem}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),#7cc576);border-radius:6px}
.facts{padding-left:1.2rem}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.pager a{display:flex;align-items:center;gap:.5rem;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .9rem;color:var(--text)}
.pager a:hover{border-color:var(--brand)}

/* Footer */
footer.site-footer{grid-area:footer;background:#1f2a1f;color:#cfd8cc;padding:1.2rem 1.5rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;font-size:.9rem}
footer a{color:#a8e0a2}

.backdrop{display:none}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-areas:"header" "main" "footer"}
  .menu-btn{display:block}
  .tagline{display:none}
  nav.sidebar{position:fixed;left:0;top:64px;bottom:0;height:auto;width:min(80vw,var(--nav-w));transform:translateX(-100%);transition:transform .25s;z-index:30;box-shadow:var(--shadow)}
  body.nav-open nav.sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function setGroup(btn,open){

}
function route(){
  const id=(location.hash.replace(/^#\/?/,'')||'home').toLowerCase();
  const d=DATA.find(x=>x.id===id);
  if(d){renderItem(d);
    const btn=nav.querySelector('[data-group="'+d.group+'"]');
    if(btn&&btn.getAttribute('aria-expanded')!=='true')setGroup(btn,true);
  }else renderHome();
  nav.querySelectorAll('a[data-id]').forEach(a=>{a.dataset.id===(d?d.id:'home')?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  window.scrollTo(0,0);
  if(location.hash.length>2)main.focus({preventScroll:true});
}
const menuBtn=document.getElementById('menuBtn');
function closeNav(){document.body.classList.remove('nav-open');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.addEventListener('click',()=>{const o=document.body.classList.toggle('nav-open');menuBtn.setAttribute('aria-expanded',o)});
document.getElementById('backdrop').addEventListener('click',closeNav);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
document.getElementById('year').textContent=new Date().getFullYear();
buildNav();route();
window.addEventListener('hashchange',route);
})();
</script>
</body>
</html>
