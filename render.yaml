# Render Blueprint (auto-updated on every generation) - deploys the latest one:
# generations/20261109-100551-generate-site-structure-with-header-navb
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo (default path render.yaml).
# The code must listen on 0.0.0.0:$PORT to pass Render's health check.
services:
  - type: web
    name: latest-py
    runtime: python
    plan: free
    rootDir: generations/20261109-100551-generate-site-structure-with-header-navb
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
  - type: web
    name: latest-js
    runtime: node
    plan: free
    rootDir: generations/20261109-100551-generate-site-structure-with-header-navb
    buildCommand: npm install
    startCommand: node main.js
