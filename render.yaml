# Render Blueprint (auto-updated on every generation) - deploys the latest one:
# generations/20261110-083859-generate-site-with-header-navbar-left-si
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo (default path render.yaml).
# The code must listen on 0.0.0.0:$PORT to pass Render's health check.
services:
  - type: web
    name: latest-py
    runtime: python
    plan: free
    rootDir: generations/20261110-083859-generate-site-with-header-navbar-left-si
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
  - type: web
    name: latest-js
    runtime: node
    plan: free
    rootDir: generations/20261110-083859-generate-site-with-header-navbar-left-si
    buildCommand: npm install
    startCommand: node main.js
