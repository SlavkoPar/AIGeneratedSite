<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market – Fruit &amp; Vegetables</title>
<meta name="description" content="A small guide to fruit and vegetables with characteristics and nutrition facts.">
<style>
:root{
  --bg:#f6f8f4;--surface:#fff;--text:#1f2a1f;--muted:#5b6b5b;--border:#e1e7dc;
  --brand:#2e7d32;--brand-2:#66bb6a;--accent:#fff3e0;--nav-w:260px;--radius:14px;
  --shadow:0 2px 10px rgba(30,60,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.55;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
a{color:var(--brand)}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:#fff;padding:.6rem 1rem;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}

/* Header */
.site-header{background:linear-gradient(120deg,#1b5e20,#43a047);color:#fff;display:flex;align-items:center;gap:1rem;padding:.9rem 1.25rem;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.site-header a.logo{color:#fff;text-decoration:none;display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.3rem}
.logo svg{width:36px;height:36px}
.site-header p{margin:0 0 0 auto;opacity:.9;font-size:.95rem}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:.45rem .65rem;cursor:pointer;font-size:1rem}

/* Layout */
.layout{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:0}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.sidebar h2{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:.25rem .6rem .75rem}
.nav-home{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;margin-bottom:.5rem}
.nav-home:hover{background:#eef5ea}
.nav-home[aria-current="page"]{background:var(--brand);color:#fff}
.group{margin-bottom:.4rem}
.group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:.6rem .7rem;border-radius:10px;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:left}
.group-toggle:hover{background:#eef5ea}
.group-toggle .count{font-weight:500;font-size:.8rem;color:var(--muted);margin-left:.4rem}
.chev{transition:transform .25s ease;width:18px;height:18px;flex:none}
.group-toggle[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.group-list{list-style:none;margin:0;padding:0 0 0 .4rem;overflow:hidden;display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.group-list.collapsed{grid-template-rows:0fr}
.group-list>div{min-height:0}
.group-list a{display:flex;align-items:center;gap:.6rem;padding:.42rem .7rem;margin:.1rem 0;border-radius:10px;color:var(--text);text-decoration:none}
.group-list a svg{width:26px;height:26px;flex:none}
.group-list a:hover{background:#eef5ea}
.group-list a[aria-current="page"]{background:var(--brand);color:#fff}
.group-list a[aria-current="page"] svg{background:#fff;border-radius:50%;padding:2px}
.nav-actions{display:flex;gap:.4rem;margin:1rem .6rem 0}
.nav-actions button{flex:1;font:inherit;font-size:.8rem;padding:.4rem;border-radius:8px;border:1px solid var(--border);background:#fafcf8;cursor:pointer;color:var(--muted)}
.nav-actions button:hover{background:#eef5ea;color:var(--text)}

/* Main */
main{padding:2rem clamp(1rem,4vw,3rem);max-width:1100px;width:100%}
main h1{margin:0 0 .4rem;font-size:clamp(1.7rem,3vw,2.4rem);outline:none}
.lead{color:var(--muted);margin-top:0;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin:1rem 0 2rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;text-align:center;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,60,30,.12)}
.card svg{width:72px;height:72px}
.card strong{display:block;margin-top:.4rem}
.card span{font-size:.85rem;color:var(--muted)}
.section-title{margin:1.5rem 0 .25rem;font-size:1.25rem}

.hero{display:flex;gap:1.5rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);flex-wrap:wrap}
.hero .icon-wrap{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero .icon-wrap svg{width:100px;height:100px}
.hero .info{flex:1;min-width:220px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .6rem;border-radius:999px;background:#e8f5e9;color:var(--brand);margin-bottom:.5rem}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-top:1rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow)}
.panel h2{font-size:1.1rem;margin:0 0 .75rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .25rem;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;width:45%}
tr:last-child th,tr:last-child td{border-bottom:0}
.bar{margin:.55rem 0}
.bar-label{display:flex;justify-content:space-between;font-size:.9rem}
.bar-track{height:10px;background:#edf1ea;border-radius:99px;overflow:hidden;margin-top:.25rem}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.fact{background:var(--accent);border-left:4px solid #fb8c00;padding:.9rem 1rem;border-radius:10px;margin-top:1rem}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:10px;background:var(--surface);border:1px solid var(--border);text-decoration:none;color:var(--text)}
.pager a:hover{background:#eef5ea}
.pager svg.i{width:22px;height:22px}

/* Footer */
.site-footer{background:#1b2a1b;color:#cfd8cf;padding:1.2rem;text-align:center;font-size:.9rem}
.site-footer a{color:#a5d6a7}

/* Responsive */
@media (max-width:820px){
  .menu-btn{display:inline-block}
  .site-header p{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:64px;height:calc(100vh - 64px);width:min(85vw,var(--nav-w));transform:translateX(-100%);transition:transform .25s ease;z-index:15;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .backdrop{position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.35);z-index:14}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <button class="menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">☰</button>
  <a class="logo" href="#/">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="24" fill="#fff" opacity=".2"/><path d="M32 22c-5-4-16-3-17 8-2 11 6 22 12 22 2 0 3-1 5-1s3 1 5 1c6 0 14-11 12-22-1-11-12-12-17-8z" fill="#fff"/><path d="M33 14c4-5 10-5 12-3-3 4-8 5-12 3z" fill="#c8e6c9"/></svg>
    Fresh Market
  </a>
  <p>Your friendly guide to fruit &amp; vegetables</p>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Produce navigation">
    <h2>Browse</h2>
    <a href="#/" class="nav-home" data-route="">🏠 Home</a>
    <div id="navGroups"></div>
    <div class="nav-actions">
      <button type="button" id="expandAll">Expand all</button>
      <button type="button" id="collapseAll">Collapse all</button>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<footer class="site-footer">
  <p>© <span id="year"></span> Fresh Market · Nutrition values are approximate, per 100 g raw. · <a href="#/">Back to home</a></p>
</footer>

<script>
const ICONS = {
  apple:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 20c-6-5-20-4-22 10-2 14 8 26 15 26 3 0 4-2 7-2s4 2 7 2c7 0 17-12 15-26-2-14-16-15-22-10z" fill="#e53935"/><ellipse cx="21" cy="31" rx="4" ry="7" fill="#fff" opacity=".35"/><path d="M32 20c0-5 1-9 4-12" stroke="#6d4c41" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M35 13c4-6 12-6 14-4-3 5-9 6-14 4z" fill="#43a047"/></svg>`,
  pear:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14c-5 0-7 5-7 10 0 6-12 10-12 21 0 9 8 15 19 15s19-6 19-15c0-11-12-15-12-21 0-5-2-10-7-10z" fill="#c0ca33"/><ellipse cx="23" cy="44" rx="4" ry="7" fill="#fff" opacity=".3"/><path d="M32 14c0-4 1-7 3-9" stroke="#6d4c41" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 9c4-4 10-4 12-2-3 4-8 4-12 2z" fill="#43a047"/></svg>`,
  banana:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 14c0 26 18 42 42 38 4-1 5-4 2-5-20 1-34-13-37-33-1-4-7-4-7 0z" fill="#fdd835" stroke="#f9a825" stroke-width="2" stroke-linejoin="round"/><path d="M18 20c3 16 14 26 30 28" stroke="#f9a825" stroke-width="2" fill="none"/><rect x="11" y="8" width="7" height="7" rx="2" fill="#6d4c41"/><circle cx="56" cy="49" r="2.5" fill="#5d4037"/></svg>`,
  carrots:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M44 20c-3-8 0-13 4-16M46 22c6-5 11-5 15-3M43 19c-6-3-9-2-12 1" stroke="#43a047" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M38 18c5-2 10 3 8 8L16 58c-2 2-6 0-5-3z" fill="#fb8c00"/><path d="M30 30l5 3M24 40l5 3M20 48l4 2" stroke="#e65100" stroke-width="2" stroke-linecap="round"/></svg>`,
  onions:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c2 9 19 16 19 33 0 11-8 17-19 17s-19-6-19-17C13 22 30 15 32 6z" fill="#ab47bc"/><path d="M32 10c-6 10-10 20-10 30s4 15 10 16M32 10c6 10 10 20 10 30s-4 15-10 16" stroke="#7b1fa2" stroke-width="2" fill="none"/><path d="M28 57l-2 4M32 57v5M36 57l2 4" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/></svg>`,
  garlic:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c1 10 20 16 20 32 0 11-9 17-20 17s-20-6-20-17C12 22 31 16 32 6z" fill="#f5f0e6" stroke="#bcaaa4" stroke-width="2"/><path d="M32 14c-7 8-10 16-10 25s4 15 10 16M32 14c7 8 10 16 10 25s-4 15-10 16M32 14v41" stroke="#bcaaa4" stroke-width="2" fill="none"/><path d="M27 56l-2 5M32 56v6M37 56l2 5" stroke="#a1887f" stroke-width="2" stroke-linecap="round"/></svg>`,
  cabbage:`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="24" fill="#7cb342"/><path d="M14 30c6-12 30-14 38 2-6-6-30-8-38-2z" fill="#9ccc65"/><circle cx="32" cy="36" r="14" fill="#aed581"/><path d="M32 22v28M32 36l-9-9M32 36l9-9M32 44l-8-6M32 44l8-6" stroke="#558b2f" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`,
  potatoes:`<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="34" rx="25" ry="18" transform="rotate(-15 32 34)" fill="#c8a165"/><ellipse cx="24" cy="28" rx="7" ry="3" transform="rotate(-15 24 28)" fill="#fff" opacity=".25"/><g fill="#8d6e3f"><circle cx="20" cy="38" r="1.8"/><circle cx="34" cy="26" r="1.6"/><circle cx="42" cy="38" r="1.8"/><circle cx="30" cy="42" r="1.4"/><circle cx="46" cy="28" r="1.4"/></g></svg>`
};

const GROUPS = [
  {id:'fruit', name:'Fruit', items:['apple','pear','banana']},
  {id:'vegetables', name:'Vegetables', items:['carrots','onions','garlic','cabbage','potatoes']}
];

const DATA = {
  apple:{name:'Apple',latin:'Malus domestica',tint:'#ffebee',desc:'A crisp, juicy pome fruit enjoyed fresh, baked or pressed into juice and cider. There are over 7,500 cultivated varieties worldwide.',
    chars:{Family:'Rosaceae (rose family)',Origin:'Central Asia (Kazakhstan)',Season:'Late summer – autumn',Taste:'Sweet to tart, crisp',Colours:'Red, green, yellow',Storage:'Cool & dry, up to 2 months refrigerated'},
    nut:{Calories:[52,'kcal',200],Carbohydrates:[14,'g',30],Fibre:[2.4,'g',10],'Vitamin C':[4.6,'mg',60],Potassium:[107,'mg',600]},
    fact:'Apples float in water because about 25% of their volume is air.'},
  pear:{name:'Pear',latin:'Pyrus communis',tint:'#f9fbe7',desc:'A soft, buttery fruit with a distinctive teardrop shape. Pears ripen best off the tree and are lovely fresh, poached or in desserts.',
    chars:{Family:'Rosaceae (rose family)',Origin:'Europe & Western Asia',Season:'Late summer – winter',Taste:'Sweet, juicy, mildly grainy',Colours:'Green, yellow, red, brown',Storage:'Ripen at room temperature, then refrigerate'},
    nut:{Calories:[57,'kcal',200],Carbohydrates:[15,'g',30],Fibre:[3.1,'g',10],'Vitamin C':[4.3,'mg',60],Potassium:[116,'mg',600]},
    fact:'Pears ripen from the inside out — check ripeness by gently pressing near the stem.'},
  banana:{name:'Banana',latin:'Musa acuminata',tint:'#fffde7',desc:'An energy-rich tropical fruit that comes in its own easy-to-peel wrapper. Perfect for snacks, smoothies and baking.',
    chars:{Family:'Musaceae',Origin:'Southeast Asia & Papua New Guinea',Season:'All year round',Taste:'Sweet, creamy, soft',Colours:'Yellow (ripe), green (unripe)',Storage:'Room temperature, away from other fruit'},
    nut:{Calories:[89,'kcal',200],Carbohydrates:[23,'g',30],Fibre:[2.6,'g',10],'Vitamin C':[8.7,'mg',60],Potassium:[358,'mg',600]},
    fact:'Botanically, a banana is a berry, and the banana plant is actually a giant herb.'},
  carrots:{name:'Carrots',latin:'Daucus carota subsp. sativus',tint:'#fff3e0',desc:'Crunchy root vegetables famous for their beta-carotene. Delicious raw, roasted, in soups or even in cakes.',
    chars:{Family:'Apiaceae (parsley family)',Origin:'Persia (modern Iran & Afghanistan)',Season:'Summer – autumn (stores all year)',Taste:'Sweet, earthy, crunchy',Colours:'Orange, purple, yellow, white',Storage:'Refrigerate without tops, up to 4 weeks'},
    nut:{Calories:[41,'kcal',200],Carbohydrates:[10,'g',30],Fibre:[2.8,'g',10],'Vitamin C':[5.9,'mg',60],Potassium:[320,'mg',600]},
    fact:'The earliest cultivated carrots were purple or yellow — orange carrots became popular in the 17th century.'},
  onions:{name:'Onions',latin:'Allium cepa',tint:'#f3e5f5',desc:'A kitchen staple forming the flavour base of countless dishes. Pungent when raw, sweet and mellow when cooked.',
    chars:{Family:'Amaryllidaceae',Origin:'Central Asia',Season:'Summer – autumn (stores all year)',Taste:'Pungent raw, sweet when cooked',Colours:'Yellow, red, white',Storage:'Cool, dark, well-ventilated place'},
    nut:{Calories:[40,'kcal',200],Carbohydrates:[9.3,'g',30],Fibre:[1.7,'g',10],'Vitamin C':[7.4,'mg',60],Potassium:[146,'mg',600]},
    fact:'Onions make you cry because cutting them releases a sulphur compound that irritates the eyes.'},
  garlic:{name:'Garlic',latin:'Allium sativum',tint:'#efebe9',desc:'An intensely aromatic bulb made up of individual cloves. Used worldwide to add depth and warmth to food.',
    chars:{Family:'Amaryllidaceae',Origin:'Central & South Asia',Season:'Summer harvest (stores all year)',Taste:'Sharp & spicy raw, nutty when roasted',Colours:'White, purple-striped',Storage:'Room temperature, dry and airy'},
    nut:{Calories:[149,'kcal',200],Carbohydrates:[33,'g',30],Fibre:[2.1,'g',10],'Vitamin C':[31,'mg',60],Potassium:[401,'mg',600]},
    fact:'Crushing or chopping garlic produces allicin, the compound responsible for its strong aroma.'},
  cabbage:{name:'Cabbage',latin:'Brassica oleracea var. capitata',tint:'#f1f8e9',desc:'A leafy, dense head vegetable that is hardy, affordable and versatile — from coleslaw to sauerkraut and stews.',
    chars:{Family:'Brassicaceae (mustard family)',Origin:'Europe (Mediterranean)',Season:'Autumn – spring',Taste:'Mild, peppery, slightly sweet',Colours:'Green, red/purple, white',Storage:'Refrigerate whole, up to 2 months'},
    nut:{Calories:[25,'kcal',200],Carbohydrates:[5.8,'g',30],Fibre:[2.5,'g',10],'Vitamin C':[36.6,'mg',60],Potassium:[170,'mg',600]},
    fact:'Red cabbage changes colour with acidity — it can be used as a natural pH indicator.'},
  potatoes:{name:'Potatoes',latin:'Solanum tuberosum',tint:'#fbf3e6',desc:'Starchy tubers and one of the world\'s most important food crops. Boil, mash, roast, bake or fry them.',
    chars:{Family:'Solanaceae (nightshade family)',Origin:'Andes, South America (Peru)',Season:'Summer – autumn (stores all year)',Taste:'Mild, earthy, starchy',Colours:'Brown, yellow, red, purple',Storage:'Cool, dark place — not in the fridge'},
    nut:{Calories:[77,'kcal',200],Carbohydrates:[17,'g',30],Fibre:[2.2,'g',10],'Vitamin C':[19.7,'mg',60],Potassium:[425,'mg',600]},
    fact:'In 1995, the potato became the first vegetable to be grown in space.'}
};

const ORDER = GROUPS.flatMap(g => g.items);
const groupOf = id => GROUPS.find(g => g.items.includes(id));
const main = document.getElementById('main');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menuBtn');
const STORE = 'freshmarket-nav';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e) {}

const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildNav(){
  document.getElementById('navGroups').innerHTML = GROUPS.map(g => {
    const open = state[g.id] !== false;
    return `<div class="group">
      <button type="button" class="group-toggle" aria-expanded="${open}" aria-controls="list-${g.id}" data-group="${g.id}">
        <span>${g.name}<span class="count">(${g.items.length})</span></span>${chev}
      </button>
      <ul class="group-list${open ? '' : ' collapsed'}" id="list-${g.id}"><div>
        ${g.items.map(i => `<li><a href="#/${i}" data-route="${i}" ${open ? '' : 'tabindex="-1"'}>${ICONS[i]}<span>${DATA[i].name}</span></a></li>`).join('')}
      </div></ul></div>`;
  }).join('');
}

function setGroup(id, open){
  const btn = document.querySelector(`.group-toggle[data-group="${id}"]`);
  const list = document.getElementById('list-' + id);
  btn.setAttribute('aria-expanded', open);
  list.classList.toggle('collapsed', !open);
  list.querySelectorAll('a').forEach(a => open ? a.removeAttribute('tabindex') : a.setAttribute('tabindex','-1'));
  state[id] = open;
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {}
}

document.getElementById('navGroups').addEventListener('click', e => {
  const btn = e.target.closest('.group-toggle');
  if (btn) setGroup(btn.dataset.group, btn.getAttribute('aria-expanded') !== 'true');
});
document.getElementById('expandAll').onclick = () => GROUPS.forEach(g => setGroup(g.id, true));
document.getElementById('collapseAll').onclick = () => GROUPS.forEach(g => setGroup(g.id, false));

/* Mobile menu */
let backdrop;
function toggleMenu(open){
  sidebar.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open);
  menuBtn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  if (open && !backdrop){ backdrop = document.createElement('div'); backdrop.className='backdrop'; backdrop.onclick=()=>toggleMenu(false); document.body.appendChild(backdrop); }
  if (!open && backdrop){ backdrop.remove(); backdrop = null; }
}
menuBtn.onclick = () => toggleMenu(!sidebar.classList.contains('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar.classList.contains('open')) { toggleMenu(false); menuBtn.focus(); } });

function card(i){
  return `<a class="card" href="#/${i}">${ICONS[i]}<strong>${DATA[i].name}</strong><span>${DATA[i].chars.Taste}</span></a>`;
}

function renderHome(){
  document.title = 'Fresh Market – Fruit & Vegetables';
  main.innerHTML = `<h1 tabindex="-1">Welcome to Fresh Market</h1>
    <p class="lead">Explore our selection of fruit and vegetables. Pick an item from the menu on the left or from the cards below to see its characteristics and nutrition facts.</p>
    ${GROUPS.map(g => `<h2 class="section-title">${g.name}</h2><div class="grid">${g.items.map(card).join('')}</div>`).join('')}`;
}

function renderItem(id){
  const d = DATA[id], g = groupOf(id), idx = ORDER.indexOf(id);
  const prev = ORDER[(idx - 1 + ORDER.length) % ORDER.length], next = ORDER[(idx + 1) % ORDER.length];
  document.title = d.name + ' – Fresh Market';
  main.innerHTML = `
    <section class="hero" aria-labelledby="title">
      <div class="icon-wrap" style="background:${d.tint}">${ICONS[id]}</div>
      <div class="info">
        <span class="badge">${g.name}</span>
        <h1 id="title" tabindex="-1">${d.name}</h1>
        <p class="lead"><em>${d.latin}</em></p>
        <p>${d.desc}</p>
      </div>
    </section>
    <div class="details">
      <section class="panel" aria-labelledby="chars-h">
        <h2 id="chars-h">Characteristics</h2>
        <table><tbody>${Object.entries(d.chars).map(([k,v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join('')}</tbody></table>
      </section>
      <section class="panel" aria-labelledby="nut-h">
        <h2 id="nut-h">Nutrition per 100 g</h2>
        ${Object.entries(d.nut).map(([k,[v,u,max]]) => `<div class="bar"><div class="bar-label"><span>${k}</span><strong>${v} ${u}</strong></div><div class="bar-track" role="img" aria-label="${k}: ${v} ${u}"><div class="bar-fill" style="width:${Math.min(100, v / max * 100)}%"></div></div></div>`).join('')}
      </section>
    </div>
    <p class="fact"><strong>Did you know?</strong> ${d.fact}</p>
    <nav class="pager" aria-label="Item navigation">
      <a href="#/${prev}"><span aria-hidden="true">←</span>${ICONS[prev].replace('<svg','<svg class="i"')}${DATA[prev].name}</a>
      <a href="#/${next}">${DATA[next].name}${ICONS[next].replace('<svg','<svg class="i"')}<span aria-hidden="true">→</span></a>
    </nav>`;
}

function route(initial){
  const id = location.hash.replace(/^#\/?/, '').toLowerCase();
  if (DATA[id]) {
    renderItem(id);
    const g = groupOf(id);
    if (document.querySelector(`.group-toggle[data-group="${g.id}"]`).getAttribute('aria-expanded') !== 'true') setGroup(g.id, true);
  } else renderHome();
  document.querySelectorAll('[data-route]').forEach(a => {
    if (a.dataset.route === (DATA[id] ? id : '')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  toggleMenu(false);
  window.scrollTo(0,0);
  if (!initial) { const h = main.querySelector('h1'); if (h) h.focus(); }
}

document.getElementById('year').textContent = new Date().getFullYear();
buildNav();
window.addEventListener('hashchange', () => route(false));
route(true);
</script>
</body>
</html>
