<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market – Fruit &amp; Vegetables</title>
<meta name="description" content="Browse fresh fruit and vegetables with characteristics and prices.">
<style>
:root{--bg:#f6f8f4;--panel:#fff;--ink:#1f2a1f;--muted:#5d6b5d;--brand:#2e7d32;--brand-2:#66bb6a;--line:#e1e7dd;--accent:#ff8f00;--radius:14px;--shadow:0 4px 18px rgba(30,60,30,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"header header" "nav main" "footer footer";min-height:100vh}
a{color:var(--brand)}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:.5rem 1rem;z-index:100}
.skip:focus{left:1rem;top:1rem}
header{grid-area:header;background:linear-gradient(120deg,#1b5e20,#43a047);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
header .logo{display:flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none}
header .logo svg{width:40px;height:40px}
header h1{font-size:1.4rem;margin:0;letter-spacing:.3px}
header p{margin:0;font-size:.85rem;opacity:.85}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:.45rem .7rem;font-size:1.1rem;cursor:pointer}
nav{grid-area:nav;background:var(--panel);border-right:1px solid var(--line);padding:1rem .75rem;overflow-y:auto}
nav .nav-tools{display:flex;gap:.4rem;margin:0 .25rem .75rem}
nav .nav-tools button{flex:1;font-size:.75rem;padding:.35rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;color:var(--muted)}
nav .nav-tools button:hover{color:var(--brand);border-color:var(--brand-2)}
.home-link{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:.5rem}
.group{margin-bottom:.4rem}
.group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:.6rem .75rem;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:.8rem;color:var(--muted);cursor:pointer;border-radius:10px}
.group-toggle:hover{background:var(--bg);color:var(--brand)}
.group-toggle .chev{transition:transform .25s;width:16px;height:16px}
.group-toggle[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.group-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.group-body.collapsed{grid-template-rows:0fr}
.group-body>ul{overflow:hidden;list-style:none;margin:0;padding:0}
.group-body.collapsed>ul{visibility:hidden;transition:visibility 0s .3s}
.item-link{display:flex;align-items:center;gap:.65rem;padding:.45rem .75rem .45rem 1rem;border-radius:10px;text-decoration:none;color:var(--ink);margin:2px 0}
.item-link svg,.home-link svg{width:28px;height:28px;flex:none}
.item-link:hover,.home-link:hover{background:#eef5ea}
.item-link[aria-current="page"],.home-link[aria-current="page"]{background:#e3f1df;color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{grid-area:main;padding:2rem clamp(1rem,4vw,3rem);min-width:0}
main:focus{outline:none}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
.crumbs a{text-decoration:none}
.hero{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem;display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center}
.hero .big-icon{width:180px;height:180px;background:radial-gradient(circle,#f3f9ef 0%,#e2efdc 100%);border-radius:50%;display:grid;place-items:center}
.hero .big-icon svg{width:120px;height:120px}
.hero h2{margin:.1rem 0 .4rem;font-size:2rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:.2rem .6rem;border-radius:99px;background:#e3f1df;color:var(--brand)}
.price{display:inline-flex;align-items:baseline;gap:.35rem;margin-top:.6rem;background:#fff4e0;color:#8a4b00;padding:.5rem .9rem;border-radius:12px;font-weight:700}
.price strong{font-size:1.6rem}
.specs{margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem}
.spec dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.spec dd{margin:.25rem 0 0;font-size:1.05rem;font-weight:600}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;background:var(--panel);border:1px solid var(--line);padding:.6rem 1rem;border-radius:10px;font-weight:600}
.pager a:hover{border-color:var(--brand-2)}
.pager svg{width:24px;height:24px}
.intro{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem;margin-bottom:2rem}
.intro h2{margin-top:0}
.section-title{margin:1.5rem 0 .75rem;font-size:1.2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;text-align:center;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card svg{width:72px;height:72px}
.card h4{margin:.5rem 0 .2rem}
.card span{color:#8a4b00;font-weight:700;font-size:.9rem}
footer{grid-area:footer;background:#1b2a1b;color:#cfd8cf;padding:1.2rem 1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;font-size:.85rem}
footer a{color:#a5d6a7}
.backdrop{display:none}
@media (max-width:820px){
body{grid-template-columns:1fr;grid-template-areas:"header" "main" "footer"}
.menu-btn{display:inline-block}
nav{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow);padding-top:1.25rem}
body.nav-open nav{transform:none}
body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.hero{grid-template-columns:1fr;text-align:center;justify-items:center;padding:1.5rem}
.hero .big-icon{width:150px;height:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
  <a class="logo" href="#home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".18"/><path d="M14 26h36l-4 24H18z" fill="#fff"/><path d="M22 26c0-8 4-14 10-14s10 6 10 14" stroke="#fff" stroke-width="4" fill="none"/><circle cx="26" cy="38" r="3" fill="#43a047"/><circle cx="38" cy="38" r="3" fill="#e53935"/></svg>
    <div><h1>Fresh Market</h1><p>Fruit &amp; vegetables, straight from the farm</p></div>
  </a>
</header>
<nav id="sidebar" aria-label="Products">
  <div class="nav-tools">
    <button type="button" id="expandAll">Expand all</button>
    <button type="button" id="collapseAll">Collapse all</button>
  </div>
  <div id="navContent"></div>
</nav>
<div class="backdrop" id="backdrop"></div>
<main id="main" tabindex="-1"></main>
<footer>
  <span>&copy; <span id="year"></span> Fresh Market. All prices are for demonstration only.</span>
  <span><a href="#home">Home</a> · Made with care &amp; vitamins</span>
</footer>
<script>
const ICONS={
apple:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 18c-6-5-20-4-22 10-2 13 7 28 14 28 4 0 5-2 8-2s4 2 8 2c7 0 16-15 14-28-2-14-16-15-22-10z" fill="#e53935"/><path d="M32 18c0-6 2-10 5-12" stroke="#5d4037" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 12c4-6 12-6 14-4-3 5-9 7-14 4z" fill="#43a047"/><ellipse cx="21" cy="30" rx="3" ry="6" fill="#fff" opacity=".35"/></svg>',
pear:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12c-5 0-7 6-7 11 0 6-11 11-11 21 0 9 8 14 18 14s18-5 18-14c0-10-11-15-11-21 0-5-2-11-7-11z" fill="#c0ca33"/><path d="M32 12c0-4 1-6 3-8" stroke="#5d4037" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M35 8c4-3 9-2 11 0-4 3-8 3-11 0z" fill="#558b2f"/><ellipse cx="23" cy="42" rx="3" ry="6" fill="#fff" opacity=".35"/><circle cx="38" cy="46" r="1" fill="#827717"/><circle cx="30" cy="52" r="1" fill="#827717"/></svg>',
banana:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 14c2 24 20 40 44 34 3-1 3-5 0-5-19 2-32-10-36-29-1-4-8-4-8 0z" fill="#fdd835" stroke="#f9a825" stroke-width="2"/><path d="M18 18c4 14 14 23 30 25" stroke="#f9a825" stroke-width="1.5" fill="none"/><rect x="12" y="8" width="7" height="7" rx="2" fill="#6d4c41"/><circle cx="57" cy="46" r="2" fill="#6d4c41"/></svg>',
carrots:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M42 20c5-3 10 2 7 7L18 57c-2 2-5 0-4-3z" fill="#fb8c00"/><path d="M28 34l4 2M24 42l4 2M34 28l3 2M20 49l3 1" stroke="#e65100" stroke-width="2" stroke-linecap="round"/><path d="M46 20c-2-6 0-12 4-14M47 21c2-6 8-9 12-8M48 22c5-1 10 2 12 6" stroke="#43a047" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',
onions:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8c2 6 4 8 10 14 8 8 10 14 10 20 0 10-9 16-20 16S12 52 12 42c0-6 2-12 10-20 6-6 8-8 10-14z" fill="#8e24aa"/><path d="M32 12c-4 12-10 18-10 30 0 8 4 13 10 16M32 12c4 12 10 18 10 30 0 8-4 13-10 16" stroke="#ce93d8" stroke-width="2" fill="none"/><path d="M28 58l-2 4M32 58v5M36 58l2 4" stroke="#bcaaa4" stroke-width="2" stroke-linecap="round"/></svg>',
garlic:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c1 8 4 10 10 16 8 7 12 13 12 21 0 10-10 15-22 15S10 53 10 43c0-8 4-14 12-21 6-6 9-8 10-16z" fill="#f5f0e6" stroke="#bcaaa4" stroke-width="2"/><path d="M32 14c-3 10-12 16-12 28 0 7 5 13 12 15M32 14c3 10 12 16 12 28 0 7-5 13-12 15M32 14v43" stroke="#d7ccc8" stroke-width="2" fill="none"/><path d="M32 4v4" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/></svg>',
cabbage:'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="24" fill="#7cb342"/><path d="M32 58c-10-8-12-24-4-36M32 58c10-8 12-24 4-36M14 30c8-2 14 2 18 10M50 30c-8-2-14 2-18 10" stroke="#c5e1a5" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="32" cy="30" r="8" fill="#aed581"/></svg>',
potatoes:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 36c-2-12 8-24 22-24 12 0 20 6 20 16 0 14-10 24-24 24-10 0-17-6-18-16z" fill="#a1887f"/><path d="M18 26c4-6 10-9 16-9" stroke="#d7ccc8" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="24" cy="34" r="1.8" fill="#5d4037"/><circle cx="36" cy="26" r="1.8" fill="#5d4037"/><circle cx="40" cy="40" r="1.8" fill="#5d4037"/><circle cx="28" cy="45" r="1.8" fill="#5d4037"/><circle cx="46" cy="30" r="1.5" fill="#5d4037"/></svg>'
};
const HOME_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#2e7d32"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const GROUPS=[
{id:'fruit',name:'Fruit',items:[
{id:'apple',name:'Apple',latin:'Malus domestica',price:2.49,unit:'kg',desc:'Crisp and juicy, apples are one of the most widely grown fruits. Perfect for snacking, baking pies or pressing into fresh juice.',specs:{Origin:'Poland',Variety:'Gala',Color:'Red / yellow',Calories:'52 kcal / 100 g',Season:'August – November',Taste:'Sweet, slightly tart','Key vitamins':'C, K, fibre',Storage:'Fridge, up to 4 weeks'}},
{id:'pear',name:'Pear',latin:'Pyrus communis',price:2.99,unit:'kg',desc:'Soft, buttery and fragrant when ripe. Pears are delicious fresh, poached in wine or paired with cheese.',specs:{Origin:'Belgium',Variety:'Conference',Color:'Green / russet',Calories:'57 kcal / 100 g',Season:'September – January',Taste:'Sweet, juicy','Key vitamins':'C, K, copper',Storage:'Room temp to ripen, then fridge'}},
{id:'banana',name:'Banana',latin:'Musa acuminata',price:1.79,unit:'kg',desc:'An energy-packed tropical favourite with a natural wrapper. Great in smoothies, breakfast bowls and banana bread.',specs:{Origin:'Ecuador',Variety:'Cavendish',Color:'Yellow',Calories:'89 kcal / 100 g',Season:'All year',Taste:'Sweet, creamy','Key vitamins':'B6, C, potassium',Storage:'Room temperature, 3–5 days'}}
]},
{id:'vegetables',name:'Vegetables',items:[
{id:'carrots',name:'Carrots',latin:'Daucus carota',price:1.19,unit:'kg',desc:'Sweet, crunchy roots rich in beta-carotene. Enjoy raw, roasted, steamed or blended into soups.',specs:{Origin:'Netherlands',Variety:'Nantes',Color:'Orange',Calories:'41 kcal / 100 g',Season:'June – March',Taste:'Sweet, earthy','Key vitamins':'A, K, B6',Storage:'Fridge, up to 3 weeks'}},
{id:'onions',name:'Onions',latin:'Allium cepa',price:0.99,unit:'kg',desc:'The foundation of countless dishes. Red onions add a mild, sweet bite to salads and turn jammy when caramelised.',specs:{Origin:'Spain',Variety:'Red Baron',Color:'Purple / red',Calories:'40 kcal / 100 g',Season:'July – April',Taste:'Pungent raw, sweet cooked','Key vitamins':'C, B6, folate',Storage:'Cool, dry and dark place'}},
{id:'garlic',name:'Garlic',latin:'Allium sativum',price:6.90,unit:'kg',desc:'Aromatic bulbs that bring depth and warmth to sauces, marinades and roasts. A little goes a long way.',specs:{Origin:'France',Variety:'Lautrec White',Color:'White',Calories:'149 kcal / 100 g',Season:'July – December',Taste:'Strong, spicy','Key vitamins':'B6, C, manganese',Storage:'Dry, ventilated, up to 6 months'}},
{id:'cabbage',name:'Cabbage',latin:'Brassica oleracea',price:1.49,unit:'piece',desc:'A hearty leafy vegetable, ideal for coleslaw, stir-fries, soups and fermenting into sauerkraut.',specs:{Origin:'Germany',Variety:'White cabbage',Color:'Pale green',Calories:'25 kcal / 100 g',Season:'September – March',Taste:'Mild, peppery','Key vitamins':'C, K, folate','Average weight':'1.2 kg'}},
{id:'potatoes',name:'Potatoes',latin:'Solanum tuberosum',price:0.89,unit:'kg',desc:'Versatile and filling staple. Boil, mash, bake, roast or fry – there is a potato dish for every occasion.',specs:{Origin:'Ireland',Variety:'Maris Piper',Color:'Golden brown',Calories:'77 kcal / 100 g',Season:'All year',Taste:'Mild, floury','Key vitamins':'C, B6, potassium',Storage:'Cool, dark place, not the fridge'}}
]}
];
const ALL=GROUPS.flatMap(g=>g.items.map(i=>({...i,group:g})));
const fmt=n=>'€'+n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Navigation ---------- */
const STORE='fm-groups';
let groupState={};
try{groupState=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
function buildNav(){
  let html='<a class="home-link" href="#home" data-id="home">'+HOME_ICON+'Overview</a>';
  GROUPS.forEach(g=>{
    const open=groupState[g.id]!==false;
    html+='<div class="group"><button type="button" class="group-toggle" aria-expanded="'+open+'" aria-controls="grp-'+g.id+'" data-group="'+g.id+'"><span>'+esc(g.name)+' ('+g.items.length+')</span>'+CHEV+'</button>'+
    '<div class="group-body'+(open?'':' collapsed')+'" id="grp-'+g.id+'"><ul>'+
    g.items.map(i=>'<li><a class="item-link" href="#'+i.id+'" data-id="'+i.id+'"'+(open?'':' tabindex="-1"')+'>'+ICONS[i.id]+'<span>'+esc(i.name)+'</span></a></li>').join('')+
    '</ul></div></div>';
  });
  document.getElementById('navContent').innerHTML=html;
}
function setGroup(id,open){
  const btn=document.querySelector('[data-group="'+id+'"]');
  const body=document.getElementById('grp-'+id);
  btn.setAttribute('aria-expanded',open);
  body.classList.toggle('collapsed',!open);
  body.querySelectorAll('a').forEach(a=>open?a.removeAttribute('tabindex'):a.setAttribute('tabindex','-1'));
  groupState[id]=open;
  try{localStorage.setItem(STORE,JSON.stringify(groupState))}catch(e){}
}
document.getElementById('navContent').addEventListener('click',e=>{
  const btn=e.target.closest('.group-toggle');
  if(btn){setGroup(btn.dataset.group,btn.getAttribute('aria-expanded')!=='true');return}
  if(e.target.closest('a'))closeNav();
});
document.getElementById('expandAll').onclick=()=>GROUPS.forEach(g=>setGroup(g.id,true));
document.getElementById('collapseAll').onclick=()=>GROUPS.forEach(g=>setGroup(g.id,false));

/* mobile menu */
const menuBtn=document.getElementById('menuBtn');
function closeNav(){document.body.classList.remove('nav-open');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.onclick=()=>{const o=document.body.classList.toggle('nav-open');menuBtn.setAttribute('aria-expanded',o)};
document.getElementById('backdrop').onclick=closeNav;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});

/* ---------- Pages ---------- */
const main=document.getElementById('main');
function homePage(){
  document.title='Fresh Market – Fruit & Vegetables';
  return '<section class="intro"><h2>Welcome to Fresh Market</h2><p>Explore our selection of seasonal fruit and vegetables. Pick a product from the menu on the left or from the cards below to see its characteristics and current price.</p></section>'+
  GROUPS.map(g=>'<h3 class="section-title">'+esc(g.name)+'</h3><div class="cards">'+
  g.items.map(i=>'<a class="card" href="#'+i.id+'">'+ICONS[i.id]+'<h4>'+esc(i.name)+'</h4><span>'+fmt(i.price)+' / '+i.unit+'</span></a>').join('')+'</div>').join('');
}
function itemPage(item){
  document.title=item.name+' – Fresh Market';
  const idx=ALL.indexOf(item),prev=ALL[(idx-1+ALL.length)%ALL.length],next=ALL[(idx+1)%ALL.length];
  return '<div class="crumbs"><a href="#home">Home</a> › '+esc(item.group.name)+' › <span aria-current="page">'+esc(item.name)+'</span></div>'+
  '<article><section class="hero"><div class="big-icon">'+ICONS[item.id]+'</div><div>'+
  '<span class="tag">'+esc(item.group.name)+'</span><h2>'+esc(item.name)+'</h2><p><em>'+esc(item.latin)+'</em></p><p>'+esc(item.desc)+'</p>'+
  '<div class="price" aria-label="Price"><strong>'+fmt(item.price)+'</strong> per '+item.unit+'</div></div></section>'+
  '<h3 class="section-title">Characteristics</h3><dl class="specs">'+
  Object.entries(item.specs).map(([k,v])=>'<div class="spec"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+
  '<div class="spec"><dt>Price</dt><dd>'+fmt(item.price)+' / '+item.unit+'</dd></div></dl></article>'+
  '<div class="pager"><a href="#'+prev.id+'">← '+ICONS[prev.id]+esc(prev.name)+'</a><a href="#'+next.id+'">'+ICONS[next.id]+esc(next.name)+' →</a></div>';
}
function route(first){
  const id=(location.hash||'#home').slice(1);
  const item=ALL.find(i=>i.id===id);
  main.innerHTML=item?itemPage(item):homePage();
  const cur=item?id:'home';
  document.querySelectorAll('#navContent a').forEach(a=>{a.dataset.id===cur?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  if(item&&groupState[item.group.id]===false)setGroup(item.group.id,true);
  if(!first){window.scrollTo(0,0);main.focus({preventScroll:true})}
}
buildNav();
window.addEventListener('hashchange',()=>route(false));
route(true);
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
