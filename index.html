<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market – Fruit &amp; Vegetables</title>
<style>
:root{--green:#2f7d32;--green-d:#1b5e20;--bg:#f6f8f4;--card:#fff;--text:#1f2a1f;--muted:#5d6b5d;--border:#dfe6da;--accent:#ff8f00;--nav-w:260px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:var(--nav-w) 1fr;grid-template-areas:"header header" "nav main" "footer footer";min-height:100vh}
a{color:var(--green)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:100}
.skip:focus{left:1rem;top:1rem}
header{grid-area:header;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:20}
header .logo{font-size:2rem}
header h1{margin:0;font-size:1.4rem}
header p{margin:0;opacity:.85;font-size:.9rem}
#menuBtn{display:none;margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:.45rem .75rem;font-size:1rem;cursor:pointer}
nav{grid-area:nav;background:var(--card);border-right:1px solid var(--border);padding:1rem .75rem;overflow-y:auto}
nav .home{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:8px;text-decoration:none;color:var(--text);font-weight:600;margin-bottom:.5rem}
nav .home:hover{background:var(--bg)}
.group{margin-bottom:.5rem}
.group-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:.6rem .75rem;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted);cursor:pointer;border-radius:8px}
.group-btn:hover{background:var(--bg);color:var(--text)}
.chev{transition:transform .2s;font-size:.8rem}
.group-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.group ul{list-style:none;margin:0;padding:0 0 0 .25rem;overflow:hidden}
.group ul[hidden]{display:none}
.group li a{display:flex;align-items:center;gap:.65rem;padding:.5rem .75rem;border-radius:8px;text-decoration:none;color:var(--text)}
.group li a:hover{background:var(--bg)}
.group li a[aria-current="page"]{background:#e3f1e1;color:var(--green-d);font-weight:600;box-shadow:inset 3px 0 0 var(--green)}
.ico{font-size:1.35rem;width:1.6rem;text-align:center;line-height:1}
.nav-actions{display:flex;gap:.4rem;padding:.25rem .75rem .75rem}
.nav-actions button{flex:1;font:inherit;font-size:.75rem;padding:.35rem;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--muted)}
.nav-actions button:hover{color:var(--text)}
main{grid-area:main;padding:2rem;max-width:1000px;width:100%}
main:focus{outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;text-decoration:none;color:var(--text);text-align:center;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.card .big{font-size:3rem;display:block;margin-bottom:.5rem}
.card .price{color:var(--accent);font-weight:700}
h2{margin-top:0}
h3{color:var(--muted);text-transform:uppercase;font-size:.85rem;letter-spacing:.06em;margin:2rem 0 .75rem}
.detail{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.hero{display:flex;align-items:center;gap:1.5rem;padding:2rem;background:linear-gradient(135deg,var(--tint,#eef6ec),#fff)}
.hero .icon{font-size:5.5rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.hero h2{margin:0 0 .25rem;font-size:2rem}
.badge{display:inline-block;background:#e3f1e1;color:var(--green-d);padding:.15rem .6rem;border-radius:99px;font-size:.8rem;font-weight:600}
.hero .price{font-size:1.6rem;font-weight:800;color:var(--accent);margin-top:.5rem}
.hero .price small{font-size:.9rem;color:var(--muted);font-weight:500}
.body{padding:1.5rem 2rem 2rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--border)}
th{width:40%;color:var(--muted);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.pager a{text-decoration:none;padding:.5rem .9rem;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.pager a:hover{border-color:var(--green)}
footer{grid-area:footer;background:#1f2a1f;color:#cfd8cc;padding:1.25rem 1.5rem;text-align:center;font-size:.9rem}
footer a{color:#a5d6a7}
@media (max-width:760px){
body{grid-template-columns:1fr;grid-template-areas:"header" "main" "footer"}
#menuBtn{display:block}
nav{position:fixed;top:0;left:0;bottom:0;width:min(80vw,var(--nav-w));z-index:30;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 16px rgba(0,0,0,.2)}
body.nav-open nav{transform:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
body.nav-open .scrim{display:block}
main{padding:1.25rem}
.hero{flex-direction:column;text-align:center;padding:1.5rem}
.body{padding:1rem 1.25rem 1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
<span class="logo" aria-hidden="true">🧺</span>
<div><h1>Fresh Market</h1><p>Farm-fresh fruit &amp; vegetables</p></div>
<button id="menuBtn" aria-controls="sidenav" aria-expanded="false">☰ Menu</button>
</header>
<nav id="sidenav" aria-label="Products"></nav>
<div class="scrim" id="scrim"></div>
<main id="main" tabindex="-1"></main>
<footer>
<p>&copy; <span id="yr"></span> Fresh Market · Prices are illustrative only · <a href="#/">Home</a></p>
</footer>
<script>
const groups=[
{id:'fruit',name:'Fruit',items:[
{id:'apple',name:'Apple',icon:'🍎',tint:'#fde3e3',price:2.49,unit:'kg',desc:'Crisp, juicy and sweet-tart. A classic for snacking, baking and juicing.',c:{Variety:'Gala / Honeycrisp',Origin:'Washington, USA',Season:'August – November',Color:'Red / Green',Calories:'52 kcal per 100 g',Storage:'Refrigerate, up to 6 weeks','Rich in':'Fiber, Vitamin C'}},
{id:'pear',name:'Pear',icon:'🍐',tint:'#eef7d9',price:2.99,unit:'kg',desc:'Buttery, fragrant flesh with gentle sweetness. Best eaten when just ripe.',c:{Variety:'Williams / Conference',Origin:'Belgium',Season:'August – February',Color:'Green / Yellow',Calories:'57 kcal per 100 g',Storage:'Ripen at room temp, then refrigerate','Rich in':'Fiber, Copper'}},
{id:'banana',name:'Banana',icon:'🍌',tint:'#fff6cc',price:1.29,unit:'kg',desc:'Naturally packaged energy. Creamy, sweet and perfect for smoothies.',c:{Variety:'Cavendish',Origin:'Ecuador',Season:'Year-round',Color:'Yellow',Calories:'89 kcal per 100 g',Storage:'Room temperature, away from other fruit','Rich in':'Potassium, Vitamin B6'}}]},
{id:'veg',name:'Vegetables',items:[
{id:'carrots',name:'Carrots',icon:'🥕',tint:'#ffe7d1',price:1.19,unit:'kg',desc:'Sweet, crunchy roots great raw, roasted or in soups.',c:{Variety:'Nantes',Origin:'Netherlands',Season:'June – March',Color:'Orange',Calories:'41 kcal per 100 g',Storage:'Refrigerate, up to 4 weeks','Rich in':'Beta-carotene, Vitamin K'}},
{id:'onions',name:'Onions',icon:'🧅',tint:'#f6ead8',price:0.99,unit:'kg',desc:'The foundation of countless dishes – pungent raw, sweet when caramelised.',c:{Variety:'Yellow storage onion',Origin:'Spain',Season:'Year-round',Color:'Golden brown',Calories:'40 kcal per 100 g',Storage:'Cool, dark, dry place','Rich in':'Vitamin C, Quercetin'}},
{id:'garlic',name:'Garlic',icon:'🧄',tint:'#f3f0ea',price:6.49,unit:'kg',desc:'Aromatic bulbs with bold flavour. A little goes a long way.',c:{Variety:'Purple stripe',Origin:'France',Season:'July – December',Color:'White / Purple',Calories:'149 kcal per 100 g',Storage:'Room temperature, well ventilated','Rich in':'Manganese, Allicin'}},
{id:'cabbage',name:'Cabbage',icon:'🥬',tint:'#e2f4dc',price:1.49,unit:'piece',desc:'Dense, leafy heads for slaws, stir-fries, sauerkraut and stews.',c:{Variety:'Savoy / White',Origin:'Germany',Season:'September – April',Color:'Green',Calories:'25 kcal per 100 g',Storage:'Refrigerate, up to 2 months','Rich in':'Vitamin K, Vitamin C'}},
{id:'potatoes',name:'Potatoes',icon:'🥔',tint:'#f3e6cf',price:0.89,unit:'kg',desc:'Versatile staple – mash it, bake it, fry it or boil it.',c:{Variety:'Yukon Gold',Origin:'Idaho, USA',Season:'Year-round',Color:'Golden',Calories:'77 kcal per 100 g',Storage:'Cool, dark place (not the fridge)','Rich in':'Potassium, Vitamin C'}}]}];
const all=groups.flatMap(g=>g.items.map(i=>({...i,group:g.name})));
const fmt=n=>'$'+n.toFixed(2);
const nav=document.getElementById('sidenav'),main=document.getElementById('main');
const saved=JSON.parse(localStorage.getItem('navGroups')||'{}');

function buildNav(){
let h='<a class="home" href="#/"><span class="ico" aria-hidden="true">🏠</span>All products</a>';
h+='<div class="nav-actions"><button type="button" data-all="1">Expand all</button><button type="button" data-all="0">Collapse all</button></div>';
groups.forEach(g=>{const open=saved[g.id]!==false;
h+=`<div class="group"><button class="group-btn" type="button" aria-expanded="${open}" aria-controls="grp-${g.id}" data-g="${g.id}">${g.name}<span class="chev" aria-hidden="true">▼</span></button><ul id="grp-${g.id}" ${open?'':'hidden'}>`+
g.items.map(i=>`<li><a href="#/${i.id}" data-id="${i.id}"><span class="ico" aria-hidden="true">${i.icon}</span>${i.name}</a></li>`).join('')+'</ul></div>';});
nav.innerHTML=h;}
function setGroup(id,open){const b=nav.querySelector(`[data-g="${id}"]`);b.setAttribute('aria-expanded',open);document.getElementById('grp-'+id).hidden=!open;saved[id]=open;localStorage.setItem('navGroups',JSON.stringify(saved));}
nav.addEventListener('click',e=>{const b=e.target.closest('.group-btn');if(b){setGroup(b.dataset.g,b.getAttribute('aria-expanded')!=='true');return;}
const a=e.target.closest('[data-all]');if(a){groups.forEach(g=>setGroup(g.id,a.dataset.all==='1'));return;}
if(e.target.closest('a'))closeNav();});

function card(i){return `<a class="card" href="#/${i.id}"><span class="big" aria-hidden="true">${i.icon}</span><strong>${i.name}</strong><br><span class="price">${fmt(i.price)}</span> <small>/ ${i.unit}</small></a>`;}
function home(){document.title='Fresh Market – Fruit & Vegetables';
main.innerHTML='<h2>Welcome to Fresh Market</h2><p>Browse our selection of fresh produce. Pick an item from the menu or below to see details.</p>'+
groups.map(g=>`<h3>${g.name}</h3><div class="grid">${g.items.map(card).join('')}</div>`).join('');}
function detail(i){document.title=i.name+' – Fresh Market';const idx=all.indexOf(i),prev=all[(idx-1+all.length)%all.length],next=all[(idx+1)%all.length];
main.innerHTML=`<article class="detail" style="--tint:${i.tint}"><div class="hero"><span class="icon" role="img" aria-label="${i.name}">${i.icon}</span><div><span class="badge">${i.group}</span><h2>${i.name}</h2><p>${i.desc}</p><div class="price">${fmt(i.price)} <small>per ${i.unit}</small></div></div></div>
<div class="body"><h3 style="margin-top:0">Characteristics</h3><table><tbody>${Object.entries(i.c).map(([k,v])=>`<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join('')}<tr><th scope="row">Price</th><td><strong>${fmt(i.price)}</strong> per ${i.unit}</td></tr></tbody></table></div></article>
<div class="pager"><a href="#/${prev.id}">← ${prev.icon} ${prev.name}</a><a href="#/${next.id}">${next.name} ${next.icon} →</a></div>`;}
function route(){const id=location.hash.replace(/^#\/?/,'');const item=all.find(i=>i.id===id);
nav.querySelectorAll('a[data-id]').forEach(a=>a.toggleAttribute('aria-current',false));
if(item){const a=nav.querySelector(`a[data-id="${id}"]`);a.setAttribute('aria-current','page');const g=groups.find(g=>g.items.includes(groups.flatMap(x=>x.items).find(x=>x.id===id)));if(document.getElementById('grp-'+g.id).hidden)setGroup(g.id,true);detail(item);}
else home();
if(location.hash)main.focus({preventScroll:true});window.scrollTo(0,0);}
const menuBtn=document.getElementById('menuBtn');
function closeNav(){document.body.classList.remove('nav-open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.onclick=()=>{const o=document.body.classList.toggle('nav-open');menuBtn.setAttribute('aria-expanded',o);};
document.getElementById('scrim').onclick=closeNav;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
document.getElementById('yr').textContent=new Date().getFullYear();
buildNav();window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
