<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Green Basket – Fresh Produce Guide</title>
<meta name='description' content='A small produce catalogue with fruit and vegetables, their characteristics and sample prices.'>
<style>
:root{--bg:#faf6ee;--panel:#fffdf8;--ink:#1d2a22;--muted:#5d6b62;--brand:#1f3d2b;--brand2:#2f5a3f;--accent:#d9661f;--line:#e4dccb;--radius:14px;--head:60px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:var(--head) 1fr auto;grid-template-areas:'head head' 'nav main' 'foot foot'}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;line-height:1.2;margin:0}
a{color:var(--brand2)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* Header */
.site-header{grid-area:head;position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;height:var(--head)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:Georgia,serif;font-size:1.3rem;font-weight:700;letter-spacing:.2px}
.brand svg{width:34px;height:34px}
.site-header .tag{margin-left:auto;font-size:.9rem;color:#cfe3d4}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;width:42px;height:42px;padding:0;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:22px;height:22px}

/* Sidebar */
.sidebar{grid-area:nav;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 24px;position:sticky;top:var(--head);align-self:start;height:calc(100vh - var(--head));overflow-y:auto}
.nav-tools{display:flex;gap:8px;margin:0 4px 14px}
.nav-tools button{flex:1;font:inherit;font-size:.8rem;padding:7px 8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;cursor:pointer}
.nav-tools button:hover{border-color:var(--brand2)}
.home-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:10px}
.home-link svg{width:22px;height:22px}
.group{margin-bottom:8px}
.group-btn{width:100%;display:flex;align-items:center;justify-content:space-between;font:inherit;font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;padding:10px;border-radius:10px;cursor:pointer;text-align:left}
.group-btn:hover{background:#f1ebdd;color:var(--ink)}
.group-btn svg{width:16px;height:16px;transition:transform .2s}
.group-btn[aria-expanded='true'] svg{transform:rotate(90deg)}
.group ul{list-style:none;margin:2px 0 0;padding:0}
.group li a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.group li a svg{width:28px;height:28px;flex:none}
.group li a:hover,.home-link:hover{background:#f1ebdd}
.sidebar a[aria-current='page']{background:var(--brand);color:#fff}
.backdrop{display:none}

/* Main */
main{grid-area:main;padding:36px clamp(18px,4vw,56px) 56px;min-width:0}
.wrap{max-width:920px;margin:0 auto}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:18px}
.crumbs a{color:var(--muted)}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch;margin:10px 0 0}
h1{font-size:clamp(1.9rem,4vw,2.7rem)}
h1:focus{outline:none}
.section-title{font-size:1.3rem;margin:38px 0 14px;display:flex;align-items:baseline;gap:10px}
.section-title span{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(31,61,43,.12);border-color:#cdbf9f}
.card .ico{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.card .ico svg{width:46px;height:46px}
.card strong{font-family:Georgia,serif;font-size:1.1rem}
.card .p{color:var(--accent);font-weight:700;font-size:.95rem}

.hero{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.hero .ico{width:200px;height:200px;border-radius:24px;display:grid;place-items:center}
.hero .ico svg{width:150px;height:150px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:#e6efe2;color:var(--brand);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.price{margin-top:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:Georgia,serif;font-size:2.2rem;color:var(--accent)}
.price span{color:var(--muted)}
.price small{flex-basis:100%;color:var(--muted);font-size:.8rem}
.specs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.specs div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.specs dt{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:4px 0 0;font-size:1.02rem}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);background:var(--panel);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600}
.pager a:hover{border-color:var(--brand2)}
.pager svg{width:24px;height:24px}

/* Footer */
.site-footer{grid-area:foot;background:var(--brand);color:#cfe3d4;padding:22px 24px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.9rem;position:relative;z-index:5}
.site-footer a{color:#fff}

@media (max-width:820px){
body{grid-template-columns:minmax(0,1fr);grid-template-areas:'head' 'main' 'foot'}
.menu-btn{display:inline-flex}
.site-header .tag{display:none}
.sidebar{position:fixed;top:var(--head);left:0;bottom:0;width:min(290px,86vw);height:auto;z-index:25;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s;box-shadow:8px 0 30px rgba(0,0,0,.18)}
body.nav-open .sidebar{transform:none;visibility:visible}
body.nav-open .backdrop{display:block;position:fixed;inset:var(--head) 0 0 0;background:rgba(20,30,24,.45);z-index:20}
.hero{grid-template-columns:1fr;gap:20px;padding:20px}
.hero .ico{width:140px;height:140px}
.hero .ico svg{width:104px;height:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<a class='skip' href='#main'>Skip to content</a>

<header class='site-header'>
<button class='menu-btn' id='menuBtn' type='button' aria-label='Toggle navigation' aria-controls='sidebar' aria-expanded='false'>
<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg>
</button>
<a class='brand' href='#/'>
<svg viewBox='0 0 64 64' aria-hidden='true'><path d='M10 28h44l-5 24a5 5 0 0 1-5 4H20a5 5 0 0 1-5-4z' fill='#e9b872'/><path d='M14 28c0-12 8-20 18-20s18 8 18 20' fill='none' stroke='#e9b872' stroke-width='4' stroke-linecap='round'/><circle cx='25' cy='25' r='7' fill='#e5484d'/><circle cx='39' cy='24' r='8' fill='#8fce6a'/></svg>
Green Basket
</a>
<span class='tag'>Fresh produce guide</span>
</header>

<nav class='sidebar' id='sidebar' aria-label='Produce'>
<div id='navInner'></div>
<noscript><p>This catalogue needs JavaScript to show its pages.</p></noscript>
</nav>
<div class='backdrop' id='backdrop'></div>

<main id='main'><div class='wrap' id='view'></div></main>

<footer class='site-footer'>
<span>&copy; Green Basket &middot; A demo produce catalogue</span>
<span>All prices are dummy values for illustration only.</span>
</footer>

<script>
(function(){
var ICONS={
apple:`<path d='M32 20c-6-5-20-3-20 13 0 12 8 23 14 23 3 0 4-1.5 6-1.5s3 1.5 6 1.5c6 0 14-11 14-23 0-16-14-18-20-13z' fill='#e5484d'/><path d='M32 20c0-5 1-9 4-12' stroke='#6b4226' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M36 13c4-6 10-6 14-5-1 5-6 9-14 5z' fill='#4caf50'/><path d='M19 30c1-4 4-6 7-6' stroke='#fff' stroke-width='2.5' fill='none' stroke-linecap='round' opacity='.55'/>`,
pear:`<path d='M32 14c-6 0-8 6-9 12-1 5-9 9-9 18 0 9 8 14 18 14s18-5 18-14c0-9-8-13-9-18-1-6-3-12-9-12z' fill='#b5cc3a'/><path d='M32 14c0-3 1-6 3-8' stroke='#6b4226' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M35 10c4-4 9-4 12-2-2 4-7 6-12 2z' fill='#4caf50'/><path d='M21 42c0-4 2-7 5-9' stroke='#fff' stroke-width='2.5' fill='none' stroke-linecap='round' opacity='.5'/>`,
banana:`<path d='M10 40c10 8 31 6 41-16l5 2c-4 23-27 35-45 23-3-2-4-6-1-9z' fill='#f7c948'/><path d='M51 24l-1-8 6 1v9z' fill='#7a5a2b'/><path d='M14 46c12 6 28 2 37-12' stroke='#d9a520' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='11' cy='43' r='2.5' fill='#7a5a2b'/>`,
carrots:`<path d='M40 22c-2-8 2-14 6-16 1 5 0 9-2 13 4-4 9-5 14-3-2 5-8 8-16 8z' fill='#4caf50'/><path d='M41 20c5 4 5 10 1 14L14 56c-3 2-6-1-4-4l22-28c3-4 7-5 9-4z' fill='#f58a1f'/><path d='M30 32l5 4M24 40l5 4M19 47l4 3' stroke='#c96a0c' stroke-width='2' stroke-linecap='round'/>`,
onions:`<path d='M32 16c-1-4 0-8 3-11' stroke='#4caf50' stroke-width='3.5' fill='none' stroke-linecap='round'/><path d='M32 14c4 8 20 12 20 26 0 10-9 16-20 16s-20-6-20-16c0-14 16-18 20-26z' fill='#b565a7'/><path d='M32 22c-6 8-8 20-4 33M32 22c6 8 8 20 4 33' stroke='#fff' stroke-width='2' fill='none' opacity='.4'/><path d='M28 56l-2 4M32 56v5M36 56l2 4' stroke='#8a6f55' stroke-width='2' stroke-linecap='round'/>`,
garlic:`<path d='M32 6c0 12-20 17-20 34 0 10 8 16 20 16s20-6 20-16c0-17-20-22-20-34z' fill='#f4eee2' stroke='#b9ab92' stroke-width='2' stroke-linejoin='round'/><path d='M32 18c-6 10-8 24-4 37M32 18c6 10 8 24 4 37' stroke='#b9ab92' stroke-width='2' fill='none'/><path d='M28 56l-2 4M32 56v5M36 56l2 4' stroke='#8a6f55' stroke-width='2' stroke-linecap='round'/>`,
cabbage:`<circle cx='32' cy='33' r='25' fill='#8fce6a'/><path d='M32 9c-11 10-11 38 0 49M32 9c11 10 11 38 0 49M9 28c9 2 17 10 23 28M55 28c-9 2-17 10-23 28' stroke='#4e9a3a' stroke-width='2.5' fill='none' stroke-linecap='round'/><circle cx='32' cy='33' r='25' fill='none' stroke='#4e9a3a' stroke-width='2.5'/>`,
potatoes:`<ellipse cx='32' cy='34' rx='25' ry='17' transform='rotate(-15 32 34)' fill='#c99a5b'/><circle cx='22' cy='33' r='2.2' fill='#8a6233'/><circle cx='35' cy='27' r='2' fill='#8a6233'/><circle cx='42' cy='37' r='2.2' fill='#8a6233'/><circle cx='29' cy='42' r='1.8' fill='#8a6233'/><path d='M14 30c3-6 9-9 15-10' stroke='#fff' stroke-width='2.5' fill='none' stroke-linecap='round' opacity='.35'/>`
};
function icon(id){return `<svg viewBox='0 0 64 64' aria-hidden='true' focusable='false'>${ICONS[id]}</svg>`;}

var GROUPS=[
{id:'fruit',name:'Fruit',items:[
{id:'apple',name:'Apple',tint:'#fde4e4',price:'$2.49',unit:'per lb',tag:`Crisp, juicy and endlessly snackable.`,specs:{Variety:'Gala',Origin:'Washington, USA',Season:'September – November',Taste:'Sweet with a mild tartness',Calories:'52 kcal per 100 g',Storage:'Refrigerate in the crisper drawer','Shelf life':'4 – 6 weeks chilled','Rich in':'Fibre, vitamin C'}},
{id:'pear',name:'Pear',tint:'#eef3cf',price:'$2.99',unit:'per lb',tag:`Buttery flesh with a honeyed finish.`,specs:{Variety:'Bartlett',Origin:'Oregon, USA',Season:'August – October',Taste:'Sweet, soft and floral',Calories:'57 kcal per 100 g',Storage:'Ripen at room temperature, then chill','Shelf life':'5 – 7 days once ripe','Rich in':'Fibre, copper'}},
{id:'banana',name:'Banana',tint:'#fdf1c7',price:'$0.69',unit:'per lb',tag:`The original grab-and-go energy bar.`,specs:{Variety:'Cavendish',Origin:'Ecuador',Season:'All year round',Taste:'Creamy and sweet',Calories:'89 kcal per 100 g',Storage:'Room temperature, away from other fruit','Shelf life':'3 – 5 days','Rich in':'Potassium, vitamin B6'}}
]},
{id:'vegetables',name:'Vegetables',items:[
{id:'carrots',name:'Carrots',tint:'#fde6cf',price:'$1.29',unit:'per lb',tag:`Sweet crunch, raw or roasted.`,specs:{Variety:'Nantes',Origin:'California, USA',Season:'June – November',Taste:'Earthy and sweet',Calories:'41 kcal per 100 g',Storage:'Refrigerate, tops removed','Shelf life':'3 – 4 weeks','Rich in':'Beta-carotene, vitamin K'}},
{id:'onions',name:'Onions',tint:'#f3e1ef',price:'$1.09',unit:'per lb',tag:`The base of nearly every good meal.`,specs:{Variety:'Red onion',Origin:'Idaho, USA',Season:'August – October',Taste:'Sharp raw, sweet when cooked',Calories:'40 kcal per 100 g',Storage:'Cool, dark and well ventilated','Shelf life':'1 – 2 months','Rich in':'Vitamin C, antioxidants'}},
{id:'garlic',name:'Garlic',tint:'#f1ece2',price:'$0.79',unit:'per bulb',tag:`Small bulb, big personality.`,specs:{Variety:'Softneck',Origin:'Gilroy, California',Season:'July – September',Taste:'Pungent, mellow when roasted',Calories:'149 kcal per 100 g',Storage:'Dry, dark place at room temperature','Shelf life':'3 – 5 months (whole bulb)','Rich in':'Manganese, vitamin B6'}},
{id:'cabbage',name:'Cabbage',tint:'#e2f3d8',price:'$0.89',unit:'per lb',tag:`Crunchy leaves for slaws, soups and ferments.`,specs:{Variety:'Green cabbage',Origin:'New York, USA',Season:'October – February',Taste:'Mild and peppery',Calories:'25 kcal per 100 g',Storage:'Refrigerate whole and unwashed','Shelf life':'1 – 2 months','Rich in':'Vitamin K, vitamin C'}},
{id:'potatoes',name:'Potatoes',tint:'#f3e6d3',price:'$0.99',unit:'per lb',tag:`Comfort food in its rawest form.`,specs:{Variety:'Yukon Gold',Origin:'Maine, USA',Season:'September – March',Taste:'Buttery and slightly nutty',Calories:'77 kcal per 100 g',Storage:'Cool, dark place – not the fridge','Shelf life':'2 – 3 months','Rich in':'Potassium, vitamin C'}}
]}
];

var ALL=[];
GROUPS.forEach(function(g){g.items.forEach(function(it){it.group=g;ALL.push(it);});});

var nav=document.getElementById('navInner'),view=document.getElementById('view'),menuBtn=document.getElementById('menuBtn'),backdrop=document.getElementById('backdrop');
var CHEV=`<svg viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M6 3l5 5-5 5'/></svg>`;

var state={};
try{state=JSON.parse(localStorage.getItem('gb-groups'))||{};}catch(e){state={};}
function save(){try{localStorage.setItem('gb-groups',JSON.stringify(state));}catch(e){}}

/* Build sidebar */
nav.innerHTML=`<a class='home-link' href='#/' data-route=''><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M3 11l9-8 9 8M5 10v10h14V10'/></svg>All produce</a>
<div class='nav-tools'><button type='button' id='expAll'>Expand all</button><button type='button' id='colAll'>Collapse all</button></div>`+
GROUPS.map(function(g){
return `<div class='group'><button type='button' class='group-btn' data-group='${g.id}' aria-controls='list-${g.id}' aria-expanded='true'><span>${g.name}</span>${CHEV}</button><ul id='list-${g.id}'>`+
g.items.map(function(it){return `<li><a href='#/${it.id}' data-route='${it.id}'>${icon(it.id)}<span>${it.name}</span></a></li>`;}).join('')+`</ul></div>`;
}).join('');

function setGroup(id,open){
var btn=nav.querySelector(`[data-group='${id}']`);
btn.setAttribute('aria-expanded',open?'true':'false');
document.getElementById('list-'+id).hidden=!open;
state[id]=open;
}
GROUPS.forEach(function(g){setGroup(g.id,state[g.id]!==false);});
nav.addEventListener('click',function(e){
var b=e.target.closest('.group-btn');
if(b){setGroup(b.dataset.group,b.getAttribute('aria-expanded')!=='true');save();return;}
if(e.target.closest('a'))closeNav();
});
document.getElementById('expAll').addEventListener('click',function(){GROUPS.forEach(function(g){setGroup(g.id,true);});save();});
document.getElementById('colAll').addEventListener('click',function(){GROUPS.forEach(function(g){setGroup(g.id,false);});save();});

/* Mobile nav */
function closeNav(){document.body.classList.remove('nav-open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.addEventListener('click',function(){var o=document.body.classList.toggle('nav-open');menuBtn.setAttribute('aria-expanded',o?'true':'false');});
backdrop.addEventListener('click',closeNav);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('nav-open')){closeNav();menuBtn.focus();}});

/* Views */
function homeView(){
return `<h1 tabindex='-1'>Fresh from the basket</h1><p class='lead'>Browse our small selection of fruit and vegetables. Pick an item to see its characteristics and a sample price.</p>`+
GROUPS.map(function(g){
return `<h2 class='section-title'>${g.name} <span>${g.items.length} items</span></h2><div class='grid'>`+
g.items.map(function(it){return `<a class='card' href='#/${it.id}'><span class='ico' style='background:${it.tint}'>${icon(it.id)}</span><strong>${it.name}</strong><span class='p'>${it.price} <span style='color:var(--muted);font-weight:400'>${it.unit}</span></span></a>`;}).join('')+`</div>`;
}).join('');
}
function itemView(it){
var i=ALL.indexOf(it),prev=ALL[(i-1+ALL.length)%ALL.length],next=ALL[(i+1)%ALL.length];
var specs=Object.keys(it.specs).map(function(k){return `<div><dt>${k}</dt><dd>${it.specs[k]}</dd></div>`;}).join('');
return `<p class='crumbs'><a href='#/'>All produce</a> &rsaquo; ${it.group.name} &rsaquo; ${it.name}</p>
<section class='hero'><div class='ico' style='background:${it.tint}'>${icon(it.id)}</div><div><span class='badge'>${it.group.name}</span><h1 tabindex='-1'>${it.name}</h1><p class='lead'>${it.tag}</p><p class='price'><b>${it.price}</b><span>${it.unit}</span><small>Dummy price for demonstration only.</small></p></div></section>
<h2 class='section-title'>Characteristics</h2><dl class='specs'>${specs}</dl>
<nav class='pager' aria-label='More produce'><a href='#/${prev.id}'>&larr; ${icon(prev.id)} ${prev.name}</a><a href='#/${next.id}'>${next.name} ${icon(next.id)} &rarr;</a></nav>`;
}
function notFound(){return `<h1 tabindex='-1'>Not in the basket</h1><p class='lead'>We could not find that item. <a href='#/'>Back to all produce</a>.</p>`;}

var first=true;
function render(){
var route=location.hash.replace(/^#\/?/,'').toLowerCase();
var it=ALL.filter(function(x){return x.id===route;})[0];
view.innerHTML=route===''?homeView():(it?itemView(it):notFound());
document.title=(it?it.name+' – ':'')+'Green Basket – Fresh Produce Guide';
nav.querySelectorAll('a[data-route]').forEach(function(a){
if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
});
if(it&&it.group){setGroup(it.group.id,true);save();}
if(!first){window.scrollTo(0,0);var h=view.querySelector('h1');if(h)h.focus({preventScroll:true});}
first=false;
}
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
